[workspace]
members = ["crates/cairn-core", "."]

[package]
name = "cairn"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Lightweight cross-platform browser: Slint UI, Servo engine, container-per-process tabs"

[features]
default = []
# Real Servo engine (huge build). Without it a stub engine is used so the UI can be developed quickly.
servo = ["dep:servo", "dep:winit", "dep:rustls", "dep:dpi", "dep:url", "dep:euclid", "dep:zstd", "dep:lz4_flex"]

# Extra Servo web features, for RAM/compat experiments
webfx = ["servo", "servo/webcrypto", "servo/webgl", "servo/brotli-compression-stream", "servo/clipboard"]
webfx-gpu = ["webfx", "servo/webgpu"]
webfx-xr = ["webfx", "servo/webxr"]

[dependencies]
cairn-core = { path = "crates/cairn-core" }
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
servo = { version = "0.7", optional = true, default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
euclid = { version = "0.22", optional = true }
zstd = { version = "0.13", optional = true }
lz4_flex = { version = "0.11", optional = true }
dpi = { version = "0.1", optional = true }
url = { version = "2", optional = true }
winit = { version = "0.30", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws-lc-rs"] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[[bin]]
name = "servo_probe"
path = "src/bin/servo_probe.rs"
required-features = ["servo"]

[[bin]]
name = "servo_probe_gpu"
path = "src/bin/servo_probe_gpu.rs"
required-features = ["servo"]

[[bin]]
name = "cairn"
path = "src/main.rs"

[patch.crates-io]
servo-script = { path = "vendor/servo-script" }
